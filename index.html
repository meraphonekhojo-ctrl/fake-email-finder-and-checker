<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Harvester & Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><span class="icon">🛡️</span> TempMail Harvester & Validator</h1>
        <p>Advanced Disposable Email Detection & Aggregation</p>
    </header>
    <div class="container">
        <!-- LEFT COLUMN -->
        <div class="col left-col">
            <!-- Checker -->
            <section class="card">
                <h2>⚡ Instant Fake Email Checker</h2>
                <div class="input-group">
                    <input type="text" id="checker-input" placeholder="Enter email or domain...">
                    <button id="btn-check">Validate</button>
                </div>
                <div id="checker-result" class="result-box hidden"></div>
            </section>

            <!-- Website & Domain Stats -->
            <section class="card">
                <h2>📊 Website & Domain Stats</h2>
                <input type="text" id="search-provider" class="search-input" placeholder="Search provider...">
                <div id="stats-list" class="stats-list"></div>
            </section>

            <!-- Blocklist Export -->
            <section class="card">
                <h2>📥 Blocklist Export</h2>
                <div class="btn-group">
                    <button id="btn-export-txt">TXT Blocklist</button>
                    <button id="btn-export-csv">CSV Export</button>
                    <button id="btn-export-json">JSON Export</button>
                </div>
            </section>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col right-col">
            <section class="card">
                <div class="right-header">
                    <h2>📡 Live Harvested Emails & Instant Generator</h2>
                    <div class="action-bar">
                        <button id="btn-generate" class="btn-primary">⚡ Generate Instant Fake Email</button>
                        <button id="btn-copy-emails">📋 Copy All Emails</button>
                        <button id="btn-copy-domains">📋 Copy All Domains</button>
                    </div>
                </div>
                <input type="text" id="search-emails" class="search-input" placeholder="Search by domain or email...">
                <div id="accordion-container" class="accordion-container">
                    <!-- Domain cards with emails injected via JS -->
                </div>
            </section>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
