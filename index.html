<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Fake Email Detector & Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>⚡ Instant Fake Email Detector & Checker</h1>
            <p>Real-time validation for disposable emails and domains</p>
        </div>
    </header>
    
    <main class="container">
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter email address or domain to check...">
                <button id="search-btn">Check</button>
            </div>
            <div id="search-result" class="result-message"></div>
        </section>

        <section class="stats-section">
            <div class="stat-card">
                <h3>Total Domains</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Providers Checked</h3>
                <p id="stat-providers">23</p>
            </div>
            <div class="stat-card">
                <h3>API Providers</h3>
                <p id="stat-api">15</p>
            </div>
            <div class="stat-card">
                <h3>Last Updated</h3>
                <p id="stat-updated">-</p>
            </div>
        </section>

        <section class="export-section">
            <h2>Export Blocklist</h2>
            <div class="export-buttons">
                <a href="data/disposable_domains.txt" class="btn" download>Download TXT</a>
                <a href="data/disposable_domains.json" class="btn" download>Download JSON</a>
                <a href="data/emails.csv" class="btn" download>Download CSV</a>
            </div>
        </section>

        <section class="providers-section">
            <h2>Featured Providers</h2>
            <div class="provider-grid">
                <!-- Popular providers will be inserted here -->
            </div>
        </section>

        <section class="directory-section">
            <h2>Domain Directory</h2>
            <div class="table-container">
                <table id="domain-table">
                    <thead>
                        <tr>
                            <th>Domain</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="domain-table-body">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prev-page">Previous</button>
                <span id="page-info">Page 1</span>
                <button id="next-page">Next</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
